server:
  port: 8088

spring:
  application:
    name: rbac-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rbac_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:0123456789abcdefghijklmnopqrstuvwxyz0123456789abcdefghijklmnopqrstuvwxyz}
  access-token-expiration: 900000
  refresh-token-expiration: 2592000000

rbac:
  api-key-header: X-API-Key
